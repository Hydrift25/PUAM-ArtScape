<!doctype html>
<html>
  <head>
    <title>ArtScape — Profile</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        background-color: #faf8f5;
        color: #333;
        padding-bottom: 80px;
      }

      /* ===== TOP BAR ===== */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .top-bar .back-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #333;
        text-decoration: none;
      }

      .top-bar h1 {
        font-size: 18px;
        font-weight: 700;
      }

      .top-bar .logout-btn {
        background: none;
        border: none;
        font-size: 14px;
        color: #888;
        cursor: pointer;
        text-decoration: none;
      }

      .top-bar .logout-btn:hover {
        color: #c0392b;
      }

      /* ===== MAIN CONTENT ===== */
      .profile-container {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px;
      }

      /* ===== USER CARD ===== */
      .user-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px;
        background: #fff;
        border-radius: 14px;
        margin-bottom: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #d35400;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .user-info h2 {
        font-size: 18px;
        font-weight: 600;
      }

      .user-info p {
        font-size: 13px;
        color: #888;
        margin-top: 2px;
      }

      /* ===== STATS ROW ===== */
      .stats-row {
        display: flex;
        justify-content: space-around;
        padding: 20px;
        background: #fff;
        border-radius: 14px;
        margin-bottom: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .stat-item {
        text-align: center;
      }

      .stat-item .num {
        font-size: 28px;
        font-weight: 700;
        color: #c0392b;
      }

      .stat-item .label {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }

      /* ===== COLLECTION PROGRESS ===== */
      .collection-card {
        padding: 20px;
        background: #fff;
        border-radius: 14px;
        margin-bottom: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .collection-card .card-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .collection-card .card-title span {
        margin-right: 6px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-bottom: 8px;
        color: #555;
      }

      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: #e0e0e0;
        border-radius: 5px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: #d35400;
        border-radius: 5px;
        transition: width 0.5s ease;
      }

      .progress-note {
        font-size: 12px;
        color: #999;
        margin-top: 8px;
      }

      /* ===== PHOTOS / FAVORITES CARDS ===== */
      .duo-row {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }

      .duo-card {
        flex: 1;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .duo-card.photos {
        background: linear-gradient(135deg, #fdf9e8, #fef6d0);
      }

      .duo-card.favorites {
        background: linear-gradient(135deg, #fdf0f5, #f8e0ec);
      }

      .duo-card .icon {
        font-size: 22px;
        margin-bottom: 10px;
      }

      .duo-card .num {
        font-size: 28px;
        font-weight: 700;
        color: #333;
      }

      .duo-card .label {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }

      /* ===== START JOURNEY CTA ===== */
      .cta-card {
        padding: 30px 20px;
        background: #f5f9f6;
        border-radius: 14px;
        text-align: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .cta-card .cta-icon {
        font-size: 36px;
        color: #888;
        margin-bottom: 12px;
      }

      .cta-card h3 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .cta-card p {
        font-size: 13px;
        color: #777;
        margin-bottom: 20px;
      }

      .cta-btn {
        display: inline-block;
        width: 100%;
        padding: 14px;
        background: #d35400;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
      }

      .cta-btn:hover {
        background: #b94700;
      }

      /* ===== BOTTOM NAV ===== */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        display: flex;
        justify-content: space-around;
        padding: 8px 0 12px;
        border-top: 1px solid #eee;
        z-index: 10;
      }

      .nav-item {
        text-align: center;
        text-decoration: none;
        color: #aaa;
        font-size: 11px;
        cursor: pointer;
      }

      .nav-item .nav-icon {
        font-size: 22px;
        display: block;
        margin-bottom: 2px;
      }

      .nav-item.active {
        color: #c0392b;
      }

      /* ===== LOADING STATE ===== */
      .loading {
        text-align: center;
        padding: 60px 0;
        color: #aaa;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- Top Bar -->
    <div class="top-bar">
      <a href="/" class="back-btn">&#8592;</a>
      <h1>Your Profile</h1>
      <a href="/" class="logout-btn">Logout &#8594;</a>
    </div>

    <!-- Main Content -->
    <div class="profile-container" id="profile-content">
      <div class="loading" id="loading-msg">Loading profile…</div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <a class="nav-item" href="/">
        <span class="nav-icon">🗺️</span>
        Map
      </a>
      <a class="nav-item" href="/">
        <span class="nav-icon">📷</span>
        Hunt
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">🏆</span>
        Leaderboard
      </a>
      <a class="nav-item active" href="/profile">
        <span class="nav-icon">👤</span>
        Profile
      </a>
    </div>

    <script>
      // Fetch profile data from backend and render
      async function loadProfile() {
        try {
          const res = await fetch("/api/profile");
          const data = await res.json();
          renderProfile(data);
        } catch (err) {
          console.error("Failed to load profile:", err);
          document.getElementById("loading-msg").textContent =
            "Could not load profile. Please try again.";
        }
      }

      function renderProfile(data) {
        const container = document.getElementById("profile-content");
        const initials = data.username
          ? data.username.slice(0, 2).toUpperCase()
          : "??";
        const totalArt = data.total_artworks || 0;
        const visited = data.visited || 0;
        const favorited = data.favorited || 0;
        const photos = data.photos_captured || 0;
        const points = data.points || 0;
        const remaining = totalArt - visited;
        const pct = totalArt > 0 ? Math.round((visited / totalArt) * 100) : 0;

        container.innerHTML = `
                <!-- User Card -->
                <div class="user-card">
                    <div class="avatar">${initials}</div>
                    <div class="user-info">
                        <h2>${data.username || "User"}</h2>
                        <p>${data.email || ""}</p>
                    </div>
                </div>

                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="num">${points}</div>
                        <div class="label">Points</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${visited}</div>
                        <div class="label">Visited</div>
                    </div>
                    <div class="stat-item">
                        <div class="num">${favorited}</div>
                        <div class="label">Bookmarked</div>
                    </div>
                </div>

                <!-- Collection Progress -->
                <div class="collection-card">
                    <div class="card-title">
                        <span>🏛️</span> Collection Progress
                    </div>
                    <div class="progress-header">
                        <span>Artworks Found</span>
                        <span>${visited} / ${totalArt}</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"
                             style="width: ${pct}%"></div>
                    </div>
                    <div class="progress-note">
                        ${
                          remaining > 0
                            ? remaining + " more to complete your collection"
                            : "Collection complete! 🎉"
                        }
                    </div>
                </div>

                <!-- Photos / Favorites -->
                <div class="duo-row">
                    <div class="duo-card photos">
                        <div class="icon">📷</div>
                        <div class="num">${photos}</div>
                        <div class="label">Photos Captured</div>
                    </div>
                    <div class="duo-card favorites">
                        <div class="icon">❤️</div>
                        <div class="num">${favorited}</div>
                        <div class="label">Favorites</div>
                    </div>
                </div>

                <!-- Start Journey CTA -->
                <div class="cta-card">
                    <div class="cta-icon">📷</div>
                    <h3>Start Your Journey</h3>
                    <p>Visit artworks around campus and capture
                       photos to build your collection.</p>
                    <a class="cta-btn" href="/">
                        Start Scavenger Hunt
                    </a>
                </div>
            `;
      }

      // Load on page ready
      loadProfile();
    </script>
  </body>
</html>
