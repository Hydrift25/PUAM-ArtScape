<!DOCTYPE html>
<html>

<head>
    <title>ArtScape MVP</title>
    <meta charset="utf-8" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>
        mapboxgl.accessToken = "MAPBOX_TOKEN_REMOVED";

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-74.6514, 40.3430], // Princeton
            zoom: 15
        });

        // ---------- FAVORITES ----------
        async function toggleFavorite(id, buttonElement) {
            try {
                const res = await fetch(`/api/artworks/favorite?objectid=${id}`, {
                    method:'POST'
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.favorited) {
                        buttonElement.innerText = "💔 Unfavorite";
                    } else {
                        buttonElement.innerText = "❤️ Favorite";
                    }
                }
                alert("Updated favorites!");
            } catch (error) {
                console.error("Failed to update favorite:", error);
                alert("Something went wrong. Please try again.")
            }
        }

        // ---------- LOAD ARTWORKS ----------
        async function loadArtworks(lat, lon) {
            const res = await fetch(`/api/artworks/nearby?lat=${lat}&lon=${lon}`);
            const data = await res.json();

            data.forEach(art => {
                const isFav = art.favorited;
                const buttonLabel = isFav ? "💔 Unfavorite" : "❤️ Favorite"

                const popupHTML = `
                <div style="max-width:300px">
                    <h3>${art.title || "Untitled"}</h3>
                    <p><b>Date:</b> ${art.date_range || "N/A"}</p>
                    <p>${art.description}</p>
                    ${art.image_url ? `<img src="${art.image_url}" width="100%" />` : ""}
                    <br/>
                    <button id="fav-btn-${art.objectid}" onclick="toggleFavorite(${art.objectid}, this)">
                        ${buttonLabel}
                    </button>
                </div>
            `;

                new mapboxgl.Marker()
                    .setLngLat([art.lon, art.lat])
                    .setPopup(new mapboxgl.Popup().setHTML(popupHTML))
                    .addTo(map);
            });
        }


        // ---------- GEOLOCATION ----------
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                map.setCenter([lon, lat]);

                loadArtworks(lat, lon);
            },
            () => {
                // fallback to Princeton if location denied
                loadArtworks(40.3430, -74.6514);
            }
        );

    </script>
</body>

</html>
