<!DOCTYPE html>
<html>

<head>
    <title>ArtScape MVP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .mapboxgl-popup-content {
            max-height: 400px;
            width: 300px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 12px;
        }
        
        @media (max-width: 600px) {
            .mapboxgl-popup-content {
                width: 75vw;
                max-height: 40vh;
                font-size: 16px;
                padding: 20px;
            }
            
            .mapboxgl-popup {
                max-width: 85vw !important;
           }

            .mapboxgl-popup-content button {
                padding: 15px !important;
                font-size: 16px !important;
            }
        }

        .mapboxgl-popup-content::-webkit-scrollbar {
            width: 4px;
        }
        .mapboxgl-popup-content::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .compact-popup .mapboxgl-popup-content {
            width: auto;
            min-width: 120px; /* Small enough for just a title */
            max-width: 200px;
            padding: 10px;
            text-align: center;
        }

        .compact-popup .mapboxgl-popup-close-button {
            display: none;
        }

        .compact-popup h4 {
            margin: 0 0 4px 0;
            font-size: 13px;
        }
        .compact-popup p {
            margin: 0;
            font-size: 10px;
            line-height: 1.2;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            z-index: 1000;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 30px 20px 20px 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            max-height: 40vh;
            overflow-y: auto;
            pointer-events: none;
        }

        .bottom-sheet.show {
            transform: translateY(0);
            pointer-events: auto;
        }

        .close-sheet {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #eee;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        @media (min-width: 601px) {
            .bottom-sheet {
                display: none;
            }
        }

        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .marker-inner {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s ease-in-out;
        }

        .marker-nearby .marker-inner {
            background-color: #EE7F2D;
            width: 24px;
            height: 24px;
        }

        .marker-all .marker-inner {
            background-color: #808080;
            opacity: 0.8;
        }

        .custom-marker:hover .marker-inner {
            transform: scale(1.3);
            z-index: 10;
        }

        .user-location-marker {
            width: 20px;
            height: 20px;
            background-color: #007cff;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,124,255,0.5);
            animation: pulse-blue 2s infinite;
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(0, 124, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 124, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 124, 255, 0); }
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="bottom-sheet" class="bottom-sheet">
        <div id="sheet-content"></div>
        <button class="close-sheet" onclick="closeBottomSheet()">✕</button>
    </div>

    <script>
        mapboxgl.accessToken = "MAPBOX_TOKEN_REMOVED";

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-74.6514, 40.3430], // Princeton
            zoom: 15
        });

        // ---------- FAVORITES ----------
        async function toggleFavorite(id, buttonElement) {
            try {
                const res = await fetch(`/api/artworks/favorite?objectid=${id}`, {
                    method:'POST'
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.favorited) {
                        buttonElement.innerText = "💔 Unfavorite";
                    } else {
                        buttonElement.innerText = "❤️ Favorite";
                    }
                }
                alert("Updated favorites!");
            } catch (error) {
                console.error("Failed to update favorite:", error);
                alert("Something went wrong. Please try again.")
            }
        }

        // ---------- POPUP MAKERS ----------

        function getDetailedHTML(art) {
            const isFav = art.favorited;
            const buttonLabel = isFav ? "💔 Unfavorite" : "❤️ Favorite"
            const thumbnail = art.image_url ? `${art.image_url}/full/600,/0/default.jpg` : null;

            return `
                <div style="width: 100%; min-width:220px; font-family: sans-serif; line-height: 1.5;">
                    <b style="color: #FF5733; font-size: 12px; letter-spacing: 1px">CLOSEST ARTWORK</b>
                    <h3 style="margin: 8px 0; font-size: 1.2rem">${art.title || "Untitled"}</h3>
                    <p style="margin: 5px 0; font-size: 0.9rem;"><b>Date:</b> ${art.date_range || "N/A"}</p>
                    ${thumbnail ? `<img src="${thumbnail}" style="width:100%; height: auto; object-fit: contain; border-radius:8px; margin: 10px 0;"/>` : ""}
                    <p style="font-size: 15px; line-height: 1.4; margin-bottom: 20px">${art.description || ""}</p>
                    <button onclick="toggleFavorite(${art.objectid}, this)" style="width:100%; padding:10px; cursor: pointer; background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; font-weight: bold;">
                        ${buttonLabel}
                    </button>
                </div>
            `;
        }

        function getSuccinctHTML(art) {
            return `
                <div style="text-align: center; font-family: sans-serif;">
                    <h4>${art.title || "Unknown Artwork"}</h4>
                    <p style="font-size: 13px; color: #666;"> 📍 Walk closer to reveal details.</p>
                </div>
            `;
        }

        function openBottomSheet(htmlContent) {
            document.getElementById('sheet-content').innerHTML = htmlContent;
            document.getElementById('bottom-sheet').classList.add('show');
        }

        function closeBottomSheet() {
            document.getElementById('bottom-sheet').classList.remove('show');
        }

        // ---------- LOAD ARTWORKS ----------
        async function loadArtworks(lat, lon) {
            try {
                const [nearbyRes, allRes] = await Promise.all([
                    fetch(`/api/artworks/nearby?lat=${lat}&lon=${lon}`),
                    fetch('/api/artworks')
                ]);
                const nearbyData = await nearbyRes.json();
                const allData = await allRes.json();

                const nearbyIds = nearbyData.map(a => a.objectid);

                allData.forEach(art => {
                    if (!nearbyIds.includes(art.objectid)) {
                        const el = document.createElement('div');
                        el.className = 'custom-marker marker-all';
                        el.innerHTML = '<div class="marker-inner"></div>'

                        const popup = new mapboxgl.Popup({offset: 25, focusAfterOpen: false, closeButton: false, className: 'compact-popup'})
                                    .setHTML(getSuccinctHTML(art))
                        const marker = new mapboxgl.Marker(el)
                            .setLngLat([art.lon, art.lat])
                            .addTo(map);
                        
                        if (window.innerWidth > 600) {
                            marker.setPopup(popup)
                        } else {
                            marker.getElement().addEventListener('click', () => {
                                openBottomSheet(getSuccinctHTML(art))
                            });
                        }
                    }
                });

                nearbyData.forEach(art => {
                    const el = document.createElement('div');
                    el.className = 'custom-marker marker-nearby';
                    el.innerHTML = '<div class="marker-inner"></div>';

                    const popup = new mapboxgl.Popup({offset: 25, focusAfterOpen: false})
                                .setHTML(getDetailedHTML(art))
                    const marker = new mapboxgl.Marker(el)
                        .setLngLat([art.lon, art.lat])
                        .addTo(map);

                        if (window.innerWidth > 600) {
                            marker.setPopup(popup);
                        } else {
                            marker.getElement().addEventListener('click', (e) =>{
                                e.stopPropagation();
                                openBottomSheet(getDetailedHTML(art))
                            });
                        }
                });
            } catch (e) {
                console.error("Could not load map data", e)
            }
        }


        // ---------- GEOLOCATION ----------
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                map.setCenter([lon, lat]);

                loadArtworks(lat, lon);
            },
            () => {
                // fallback to Princeton if location denied
                loadArtworks(40.3430, -74.6514);
            }
        );

        let userMarker = null;

        function trackUserLocation() {
            if (!navigator.geolocation) {
                console.log("Geolocation is not supported by your browser");
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;

                    if (!userMarker) {
                        const el = document.createElement('div');
                        el.className = 'user-location-marker';

                        userMarker = new mapboxgl.Marker(el)
                            .setLngLat([longitude, latitude])
                            .addTo(map);
                        
                        map.flyTo({ center: [longitude, latitude], zoom: 14 });
                    } else {
                        userMarker.setLngLat([longitude, latitude]);
                    }
                },
                (error) => {
                    console.error("Error getting location: ", error);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 10000
                }
            );
        }

        trackUserLocation();

    </script>
</body>

</html>
